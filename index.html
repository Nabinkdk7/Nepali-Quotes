<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>नेपाली Quotes</title>
  <meta name="description" content="Nepali quotes with English meanings and search." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg: #edf2f0;
      --surface: rgba(255,255,255,0.55);
      --header-bg: rgba(255,255,255,0.86);
      --card: rgba(255,255,255,0.7);
      --line: rgba(15,23,42,0.1);
      --line-strong: rgba(15,23,42,0.18);
      --text: #1d2b39;
      --muted: rgba(29,43,57,0.7);
      --green: #0fae87;
      --green-strong: #0f9a7d;
      --shadow: 0 10px 30px rgba(15,23,42,0.08);
      --radius: 22px;
      --radius-pill: 999px;
      --content-width: 1380px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', 'Mukta', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body, button, input {
      font-family: inherit;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      width: min(var(--content-width), calc(100% - 28px));
      margin: 0 auto;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      user-select: none;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1cbf9a, #0d8a6d);
      display: grid;
      place-items: center;
      color: white;
      box-shadow: 0 8px 18px rgba(15,174,135,0.25);
      font-size: 20px;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: clamp(2rem, 2vw, 2.4rem);
      line-height: 1;
      letter-spacing: -0.06em;
      font-weight: 800;
      font-family: 'Mukta', sans-serif;
      color: var(--text);
      white-space: nowrap;
    }

    .brand-name .eng {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .search-box {
      position: relative;
      width: min(360px, 48vw);
      min-width: 210px;
    }

    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
    }

    .search-box input {
      width: 100%;
      height: 48px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.55);
      color: var(--text);
      font-size: 14px;
      padding: 0 16px 0 42px;
      outline: none;
      transition: all 0.25s ease;
    }

    .search-box input:focus {
      border-color: rgba(15,174,135,0.5);
      box-shadow: 0 0 0 4px rgba(15,174,135,0.08);
      background: rgba(255,255,255,0.82);
    }

    .btn {
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.78);
      color: var(--text);
      border-radius: var(--radius-pill);
      height: 48px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 0 rgba(0,0,0,0.02);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .btn-primary {
      background: linear-gradient(135deg, #1cbf9a, #0d8a6d);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 10px 18px rgba(15,174,135,0.25);
    }

    .btn-icon {
      width: 48px;
      padding: 0;
      border-radius: 50%;
      position: relative;
      overflow: visible;
    }

    .btn-icon .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 50%;
      background: #1d2b39;
      color: white;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 700;
      border: 2px solid #fff;
    }

    .page {
      width: min(var(--content-width), calc(100% - 28px));
      margin: 0 auto;
      padding: 26px 0 60px;
      min-height: calc(100vh - 82px);
    }

    .hero {
      padding: 28px 0 24px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-title {
      margin: 0;
      font-family: 'Mukta', sans-serif;
      font-size: clamp(4rem, 6vw, 8rem);
      line-height: 0.9;
      letter-spacing: -0.085em;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.1em 0.3em;
    }

    .hero-title .subtitle {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(0.9rem, 1.6vw, 1.5rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      color: var(--muted);
      white-space: nowrap;
    }

    .section-label {
      margin: 12px 0 40px;
      font-size: clamp(1rem, 1.3vw, 1.3rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(29,43,57,0.8);
      font-weight: 700;
      display: inline-block;
    }

    .quote-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 18px;
    }

    .quote-pill {
      min-width: 290px;
      height: 62px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: rgba(255,255,255,0.28);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 700;
      box-shadow: 0 2px 0 rgba(0,0,0,0.02);
    }

    .quote-pill i {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .card {
      background: rgba(255,255,255,0.58);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 16px 18px 14px;
      min-height: 170px;
      box-shadow: 0 8px 20px rgba(15,23,42,0.04);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 28px rgba(15,23,42,0.06);
    }

    .card .quote-text {
      font-family: 'Mukta', sans-serif;
      font-size: 1.15rem;
      line-height: 1.7;
      font-weight: 600;
      color: var(--text);
    }

    .card .quote-meaning {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      gap: 10px;
    }

    .tag {
      display: inline-flex;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,0.04);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tiny-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.9);
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s ease;
    }

    .tiny-btn:hover {
      background: var(--text);
      color: white;
    }

    .tiny-btn.fav-on {
      background: rgba(255,40,86,0.08);
      border-color: rgba(255,40,86,0.2);
      color: #e11d48;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(18px);
      background: rgba(29,43,57,0.96);
      color: white;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 860px) {
      .topbar-inner {
        height: auto;
        padding: 16px 0;
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar {
        justify-content: space-between;
      }

      .search-box {
        width: min(100%, 420px);
      }

      .brand-name {
        font-size: 1.9rem;
      }

      .hero {
        min-height: 230px;
      }

      .hero-title {
        line-height: 0.96;
      }

      .hero-title .subtitle {
        display: block;
        width: 100%;
        margin-top: 8px;
      }
    }

    @media (max-width: 560px) {
      .toolbar {
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      .search-box {
        width: 100%;
      }

      .btn {
        flex: 1 1 auto;
      }

      .section-label {
        margin-bottom: 18px;
      }

      .quote-pill {
        min-width: 220px;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" aria-label="Nepali Quotes home">
        <div class="brand-mark"><i class="fa-solid fa-leaf"></i></div>
        <div class="brand-name">नेपाली <span class="eng">Quotes</span></div>
      </div>

      <div class="toolbar">
        <label class="search-box" aria-label="Search quotes">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="searchInput" type="text" placeholder="खोज्नुहोस् (जस्तै: love, sad, जीवन)..." />
        </label>

        <button id="randomBtn" class="btn btn-primary" type="button">
          <i class="fa-solid fa-shuffle"></i>
          Random
        </button>

        <button id="favBtn" class="btn btn-icon" type="button" aria-label="Favorites">
          <i class="fa-solid fa-heart"></i>
          <span id="favBadge" class="badge">0</span>
        </button>

        <button id="clearBtn" class="btn" type="button">
          <i class="fa-solid fa-broom"></i>
          Clear
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <h1 class="hero-title">
        नेपालीसुविचारहरु
        <span class="subtitle">Nepali quotes, with English meanings</span>
      </h1>
      <div class="section-label">सुविचारहरू · QUOTES</div>
    </section>

    <div class="quote-panel">
      <div class="quote-pill">
        <i class="fa-solid fa-arrow-down"></i>
        <span>यथ सुविचारहरु</span>
      </div>
    </div>

    <section id="quotes" class="cards" aria-live="polite"></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">Copied</div>

  <script>
    const quotes = [
      { text: 'मन सबैथोक हो । जसरी तिमी सोच्छौ, त्यस्तै बन्छौ ।', meaning: 'The mind is everything. What you think, you become.', category: 'Life', author: 'गौतम बुद्ध' },
      { text: 'स्वास्थ्य सबैभन्दा ठूलो उपहार हो, सन्तोष सबैभन्दा ठूलो धन हो ।', meaning: 'Health is the greatest gift; contentment is the greatest wealth.', category: 'Life', author: 'गौतम बुद्ध' },
      { text: 'तीन चीज धेरै समयसम्म लुक्दैनन् — सूर्य, चन्द्रमा र सत्य ।', meaning: 'Three things cannot remain hidden for long — the sun, the moon, and the truth.', category: 'Motivation', author: 'गौतम बुद्ध' },
      { text: 'आफैलाई जित्नु अरूलाई जित्नुभन्दा ठूलो काम हो ।', meaning: 'Conquering yourself is a greater victory than conquering others.', category: 'Motivation', author: 'गौतम बुद्ध' },
      { text: 'सपना त्यसैको पूरा हुन्छ, जसले सपना नछोड्ने हिम्मत गर्छ ।', meaning: 'Dreams come true for those who have the courage to keep dreaming.', category: 'Motivation', author: 'ए. पी. जे. अब्दुल कलाम' },
      { text: 'जीवन छोटो छ, मुस्कान धेरै ।', meaning: 'Life is short, smile more.', category: 'Life', author: 'अज्ञात' },
      { text: 'समय खराब हुँदैन, सोच खराब हुन्छ ।', meaning: 'Time is not bad; our thinking is.', category: 'Life', author: 'अज्ञात' },
      { text: 'प्रेममा कहिलेकाहीँ शब्दभन्दा मौनताले बढी बोल्छ ।', meaning: 'In love, silence often speaks louder than words.', category: 'Love', author: 'अज्ञात' },
      { text: 'सच्चा प्रेम कहिल्यै मर्दैन — यो समयसँगै अझ गहिरो हुँदै जान्छ ।', meaning: 'True love never dies; it only grows deeper with time.', category: 'Love', author: 'अज्ञात' },
      { text: 'परिश्रम नै सफलताको एकमात्र साँचो बाटो हो ।', meaning: 'Hard work is the true path to success.', category: 'Success', author: 'अज्ञात' },
      { text: 'हार्ने डरले कहिल्यै जित्न सकिँदैन ।', meaning: 'The fear of losing can never help you win.', category: 'Success', author: 'अज्ञात' },
      { text: 'सम्बन्ध विश्वासमा टिक्छ, शंकामा होइन ।', meaning: 'Relationships survive on trust, not doubt.', category: 'Relationships', author: 'अज्ञात' }
    ];

    const state = {
      query: '',
      favorites: new Set(JSON.parse(localStorage.getItem('npQuotesFavorites') || '[]'))
    };

    const quotesEl = document.getElementById('quotes');
    const searchInput = document.getElementById('searchInput');
    const favBadge = document.getElementById('favBadge');
    const toast = document.getElementById('toast');

    function updateFavoritesBadge() {
      favBadge.textContent = String(state.favorites.size);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function filteredQuotes() {
      const q = state.query.trim().toLowerCase();
      if (!q) return quotes;

      return quotes.filter((item) => {
        return (
          item.text.toLowerCase().includes(q) ||
          item.meaning.toLowerCase().includes(q) ||
          item.author.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q)
        );
      });
    }

    function renderQuotes() {
      const list = filteredQuotes();
      quotesEl.innerHTML = '';

      if (!list.length) {
        quotesEl.innerHTML = '<article class="card"><div class="quote-text">No quotes found.</div><div class="quote-meaning">Try a different keyword like love, sad, success, or जीवन.</div></article>';
        return;
      }

      list.forEach((item) => {
        const card = document.createElement('article');
        card.className = 'card';

        const text = document.createElement('div');
        text.className = 'quote-text';
        text.textContent = item.text;

        const meaning = document.createElement('div');
        meaning.className = 'quote-meaning';
        meaning.textContent = item.meaning;

        const meta = document.createElement('div');
        meta.className = 'meta';

        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = item.category;

        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const fav = document.createElement('button');
        fav.type = 'button';
        fav.className = 'tiny-btn' + (state.favorites.has(item.text) ? ' fav-on' : '');
        fav.innerHTML = '<i class="fa-solid fa-heart"></i>';
        fav.title = 'Add to favorites';
        fav.addEventListener('click', () => {
          if (state.favorites.has(item.text)) {
            state.favorites.delete(item.text);
            showToast('Removed from favorites');
          } else {
            state.favorites.add(item.text);
            showToast('Added to favorites');
          }

          localStorage.setItem('npQuotesFavorites', JSON.stringify([...state.favorites]));
          updateFavoritesBadge();
          renderQuotes();
        });

        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'tiny-btn';
        copy.innerHTML = '<i class="fa-regular fa-copy"></i>';
        copy.title = 'Copy quote';
        copy.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(`${item.text} — ${item.author}`);
            showToast('Copied to clipboard');
          } catch {
            showToast('Copy failed');
          }
        });

        actions.append(fav, copy);
        meta.append(tag, actions);

        card.append(text, meaning, meta);
        quotesEl.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (event) => {
      state.query = event.target.value;
      renderQuotes();
    });

    document.getElementById('randomBtn').addEventListener('click', () => {
      const random = quotes[Math.floor(Math.random() * quotes.length)];
      state.query = random.text;
      searchInput.value = random.text;
      renderQuotes();
      showToast('Random quote selected');
    });

    document.getElementById('favBtn').addEventListener('click', () => {
      const favorites = [...state.favorites];
      if (!favorites.length) {
        showToast('No favorites yet');
        return;
      }

      const items = quotes.filter((quote) => state.favorites.has(quote.text));
      state.query = '';
      searchInput.value = '';
      renderQuotes();
      showToast(`${items.length} favorite quotes shown`);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      state.favorites.clear();
      localStorage.setItem('npQuotesFavorites', '[]');
      updateFavoritesBadge();
      renderQuotes();
      showToast('Favorites cleared');
    });

    updateFavoritesBadge();
    renderQuotes();
  </script>
</body>
</html>
