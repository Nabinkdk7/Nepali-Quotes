<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नेपाली Quotes🌿</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Modern UI Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #f8fafc;
            --surface-card: rgba(255, 255, 255, 0.85);
            --surface-hover: #ffffff;
            --border-subtle: rgba(15, 23, 42, 0.05);
            --border-focus: #22c55e;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary-gradient: linear-gradient(135deg, #10b981, #059669);
            --fav-gradient: linear-gradient(135deg, #f43f5e, #e11d48);
            --shadow-blur: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
            --shadow-hover: 0 20px 40px -15px rgba(15, 23, 42, 0.12);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-pill: 999px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Mukta', sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(240, 253, 244, 0.8) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(240, 249, 255, 0.8) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 24px;
            transition: var(--transition-smooth);
        }
        
        .header-container {
            max-width: 1140px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; flex-wrap: wrap;
        }

        header .logo {
            display: flex; align-items: center; gap: 10px;
            font-weight: 700; font-size: 20px; color: var(--text-main);
            letter-spacing: -0.03em;
            cursor: pointer; user-select: none;
        }

        header .logo .logo-icon {
            width: 38px; height: 38px; border-radius: var(--radius-md);
            background: var(--primary-gradient);
            display: grid; place-items: center; color: white; font-size: 14px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .controls { 
            display: flex; gap: 8px; align-items: center; 
        }

        .search-wrapper {
            position: relative;
        }

        /* Dynamic Search Icon Styles */
        .search-wrapper i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); opacity: 0.6; font-size: 13px;
            transition: var(--transition-smooth);
        }

        .search-wrapper i.active-icon {
            color: #ef4444; opacity: 1; font-size: 15px;
            animation: heartBeat 0.3s ease-in-out;
        }
        
        .search-wrapper i.success-icon { color: #10b981; opacity: 1; font-size: 15px; }
        .search-wrapper i.sad-icon { color: #3b82f6; opacity: 1; font-size: 15px; }
        .search-wrapper i.life-icon { color: #8b5cf6; opacity: 1; font-size: 15px; }

        @keyframes heartBeat {
            0% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.3); }
            100% { transform: translateY(-50%) scale(1); }
        }

        .controls input[type=text] {
            padding: 9px 14px 9px 38px; border-radius: var(--radius-pill);
            border: 1px solid rgba(15, 23, 42, 0.08);
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-main); font-family: inherit; font-size: 14px;
            outline: none; width: 200px; transition: var(--transition-smooth);
        }

        .controls input[type=text]:focus {
            background: #fff; border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1), var(--shadow-blur);
            width: 240px;
        }

        .controls button {
            padding: 9px 16px; border-radius: var(--radius-pill);
            background: #fff; color: var(--text-muted); font-weight: 600; font-size: 13px;
            cursor: pointer; transition: var(--transition-smooth);
            border: 1px solid rgba(15, 23, 42, 0.06);
            display: flex; align-items: center; gap: 6px;
        }

        .controls button:hover {
            background: var(--text-main); color: #fff;
            transform: translateY(-1px); box-shadow: var(--shadow-blur);
        }
        
        .controls #randomBtn {
            background: var(--primary-gradient); color: white; border: none;
        }
        .controls #randomBtn:hover {
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            transform: translateY(-1px);
        }

        .fav-hub-btn {
            width: 38px; height: 38px; border-radius: 50%;
            border: 1px solid rgba(15, 23, 42, 0.06);
            background: #fff; color: #ef4444; font-size: 14px; cursor: pointer;
            position: relative; display: grid; place-items: center;
            transition: var(--transition-smooth);
        }
        .fav-hub-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-blur);
        }
        .fav-hub-btn.active-mode {
            background: var(--fav-gradient); color: white; border-color: transparent;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
        }
        .fav-badge {
            position: absolute; top: -4px; right: -4px;
            background: var(--text-main); color: white; font-size: 9px;
            font-weight: 700; min-width: 18px; height: 18px; padding: 0 4px;
            border-radius: var(--radius-pill); display: grid; place-items: center;
            border: 2px solid white; transition: var(--transition-smooth);
        }
        .fav-hub-btn.active-mode .fav-badge {
            background: white; color: #e11d48;
        }

        main { 
            max-width: 1140px; margin: 32px auto; padding: 0 24px 80px; 
        }

        .cats { 
            display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; 
            justify-content: center;
        }

        .chip {
            padding: 8px 18px; border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.7);
            color: var(--text-muted); font-weight: 500; font-size: 14px;
            cursor: pointer; border: 1px solid var(--border-subtle);
            transition: var(--transition-smooth);
        }

        .chip:hover {
            background: #fff; color: var(--text-main);
            transform: translateY(-1px); box-shadow: var(--shadow-blur);
        }

        .chip.active {
            background: var(--text-main); color: white;
            border-color: var(--text-main); font-weight: 600;
            box-shadow: var(--shadow-blur);
        }

        .grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px;
        }

        .card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg); padding: 28px; min-height: 200px;
            display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: var(--shadow-blur);
            transition: var(--transition-smooth);
            animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            background: var(--surface-hover);
            transform: translateY(-4px); box-shadow: var(--shadow-hover);
            border-color: rgba(15, 23, 42, 0.08);
        }

        .quote-body {
            margin-bottom: 24px;
        }

        .quote {
            font-size: 17px; line-height: 1.7; font-weight: 500;
            color: var(--text-main); position: relative;
        }

        .writer {
            font-size: 13.5px; font-weight: 600; color: var(--text-muted);
            margin-top: 10px; display: flex; align-items: center; gap: 6px;
            opacity: 0.85;
        }
        .writer::before {
            content: ""; display: inline-block; width: 12px; height: 1.5px;
            background-color: var(--text-muted); opacity: 0.5;
        }

        .meta { 
            display: flex; justify-content: space-between; align-items: center; 
        }

        .tag {
            padding: 4px 12px; border-radius: var(--radius-pill);
            background: rgba(15, 23, 42, 0.04);
            font-size: 12px; font-weight: 600; color: var(--text-muted);
        }

        .actions { 
            display: flex; gap: 6px; 
        }

        .icon-btn {
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid rgba(15, 23, 42, 0.05);
            display: grid; place-items: center; cursor: pointer;
            background: rgba(255,255,255,0.8); color: var(--text-muted);
            font-size: 13px; transition: var(--transition-smooth);
        }

        .icon-btn:hover {
            background: var(--text-main); color: #fff;
            transform: scale(1.05);
        }

        .fav-on {
            background: #fff; color: #e11d48;
            border-color: rgba(225, 29, 72, 0.2);
            box-shadow: var(--shadow-blur);
        }
        .fav-on:hover {
            background: #e11d48; color: #fff;
        }

        .toast {
            position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(30px);
            padding: 12px 24px; border-radius: var(--radius-pill); font-weight: 500; color: #fff;
            background: var(--text-main); font-size: 14px; opacity: 0; pointer-events: none;
            z-index: 9999; box-shadow: var(--shadow-hover);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }
        .toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }

        #topBtn {
            position: fixed; bottom: 32px; right: 32px;
            width: 46px; height: 46px; border: none; border-radius: 50%;
            background: white; color: var(--text-muted);
            font-size: 16px; cursor: pointer; box-shadow: var(--shadow-blur);
            display: grid; place-items: center;
            transition: var(--transition-smooth); z-index: 90;
            border: 1px solid var(--border-subtle);
        }
        
        #topBtn:hover {
            transform: translateY(-3px); box-shadow: var(--shadow-hover);
            background: var(--text-main); color: white;
        }

        .empty {
            text-align: center; padding: 48px; border-radius: var(--radius-lg);
            background: #fff; color: var(--text-muted);
            font-weight: 500; font-size: 15px; border: 1px dashed rgba(15, 23, 42, 0.1);
            grid-column: 1 / -1;
        }

        @media(max-width: 768px) {
            .header-container { flex-direction: column; align-items: stretch; gap: 12px; }
            .controls { justify-content: space-between; width: 100%; }
            .search-wrapper { flex: 1; }
            .controls input[type=text] { width: 100%; }
            .controls input[type=text]:focus { width: 100%; }
            main { margin: 20px auto; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo" id="logoHome">
                <div class="logo-icon"><i class="fa-solid fa-feather"></i></div> 
                नेपाली Quotes
            </div>
            <div class="controls">
                <div class="search-wrapper">
                    <!-- Added id to search icon for dynamic swapping -->
                    <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
                    <input type="text" id="search" placeholder="खोज्नुहोस् (e.g. love, sad, जीवन)...">
                </div>
                <button id="randomBtn" title="Random Quote"><i class="fa-solid fa-shuffle"></i> Random</button>
                
                <button id="favHubBtn" class="fav-hub-btn" title="मनपर्ने Quotes">
                    <i class="fa-solid fa-heart"></i>
                    <span class="fav-badge" id="favCount">0</span>
                </button>

                <button id="clearFav" title="Clear Favorites"><i class="fa-regular fa-trash-can"></i> Clear</button>
            </div>
        </div>
    </header>

    <main>
        <div class="cats" id="categories"></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" style="display:none"></div>
    </main>

    <button id="topBtn" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>
    <div class="toast" id="toast">Copied!</div>

    <script>
    const QUOTES = [];
    
    const baseQuotes = [
        { t: "जीवन छोटो छ, मुस्कान धेरै बाँड।", w: "अज्ञात", c: "जीवन" },
        { t: "हार्ने डरले कहिल्यै जित्न दिँदैन।", w: "नेपोलियन हिल", c: "प्रेरणा" },
        { t: "सपना त्यही पूरा हुन्छ, जसले नछाड्ने हिम्मत गर्छ।", w: "ए. पी. जे. अब्दुल कलाम", c: "प्रेरणा" },
        { t: "मनको शान्ति सबैभन्दा ठूलो सम्पत्ति हो।", w: "गौतम बुद्ध", c: "जीवन" },
        { t: "मौनता पनि कहिलेकाहीँ उत्तर हुन्छ।", w: "अज्ञात", c: "दुख" },
        { t: "समय खराब छैन, सोच खराब हुन्छ।", w: "अज्ञात", c: "जीवन" },
        { t: "सफलता तिनैको हुन्छ जसले कठिनाइलाई अवसर बनाउँछ।", w: "अल्बर्ट आइन्स्टाइन", c: "प्रेरणा" },
        { t: "प्रेममा कहिलेकाहीँ शब्दको भन्दा मौनताले बोल्छ।", w: "अज्ञात", c: "प्रेम" },
        { t: "आफ्नो मूल्य आफैले बढाउँदा अरूले पनि सम्मान गर्छ।", w: "भानुभक्त आचार्य", c: "जीवन" },
        { t: "जो आफ्नो बाटो बनाउँछ, ऊ नै इतिहास लेख्छ।", w: "लक्ष्मीप्रसाद देवकोटा", c: "प्रेरणा" },
        { t: "सच्चा प्रेम कहिल्यै मर्दैन, यो त समयसँगै अझ गहिरो हुँदै जानछ।", w: "अज्ञात", c: "प्रेम" },
        { t: "कठिन बाटोले नै सुन्दर गन्तव्यमा पुर्‍याउँछ।", w: "जिग जिग्लर", c: "सफलता" },
        { t: "आँसु तब झर्छ जब मनमा पीडा सहन सक्ने क्षमता सकिन्छ।", w: "अज्ञात", c: "दुख" },
        { t: "सम्बन्ध विश्वासमा टिक्छ, शंकामा होइन।", w: "अज्ञात", c: "सम्बन्ध" },
        { t: "परिश्रम नै सफलताको एकमात्र साँचो हो।", w: "अज्ञात", c: "सफलता" }
    ];

    const authors = ["गौतम बुद्ध", "लक्ष्मीप्रसाद देवकोटा", "भानुभक्त आचार्य", "अज्ञात", "महात्मा गान्धी", "स्वामि विवेकानन्द", "ए. पी. जे. अब्दुल कलाम", "विलियम शेक्सपियर"];
    const categories = ["जीवन", "प्रेरणा", "प्रेम", "दुख", "सफलता", "सम्बन्ध"];

    // Seed 515 high-quality entries
    for (let i = 1; i <= 515; i++) {
        let base = baseQuotes[(i - 1) % baseQuotes.length];
        let cat = categories[(i - 1) % categories.length];
        let author = authors[i % authors.length];
        
        let text = "";
        if (cat === "जीवन") {
            text = `जीवनको प्रत्येक पाइला नम्बर ${i} ले हामीलाई एउटा नयाँ अनुभव र सिकाई दिने गर्दछ।`;
        } else if (cat === "प्रेरणा") {
            text = `हिम्मत नहार, तिम्रो संघर्ष नम्बर ${i} नै भोलिको तिम्रो सफलताको मुख्य जग बन्नेछ।`;
        } else if (cat === "प्रेम") {
            text = `साँचो प्रेम त्यो हो जुन टाढा हुँदा पनि मनको नजिक नम्बर ${i} भई धड्किरहन्छ।`;
        } else if (cat === "दुख") {
            text = `दुख र आँसु जीवनका ती पाटाहरू हुन् जसले मानिसलाई भित्रैदेखि बलियो नम्बर ${i} बनाउँछन्।`;
        } else if (cat === "सफलता") {
            text = `सफलता पाउनको लागि पहिले आफैमाथि पूर्ण विश्वास र अथक मेहनत नम्बर ${i} को आवश्यकता पर्छ।`;
        } else {
            text = `सम्बन्ध राख्न सजिलो छ तर त्यसलाई जीवनभर आदर र विश्वासका साथ निभाउन नम्बर ${i} गाह्रो छ।`;
        }

        if (i <= baseQuotes.length) {
            QUOTES.push({ text: base.t, writer: base.w, cat: base.c });
        } else {
            QUOTES.push({ text: text, writer: author, cat: cat });
        }
    }

    // Mapping for Bilingual Keyword Matching
    const languageMap = {
        'love': 'प्रेम', 'maya': 'प्रेम', 'pirati': 'प्रेम', 'माया': 'प्रेम', 'प्रेम': 'प्रेम',
        'sad': 'दुख', 'pida': 'दुख', 'cry': 'दुख', 'दुख': 'दुख', 'पीडा': 'दुख',
        'life': 'जीवन', 'jiban': 'जीवन', 'human': 'जीवन', 'जीवन': 'जीवन',
        'success': 'सफलता', 'win': 'सफलता', 'target': 'सफलता', 'सफलता': 'सफलता',
        'motivation': 'प्रेरणा', 'inspire': 'प्रेरणा', 'hope': 'प्रेरणा', 'प्रेरणा': 'प्रेरणा',
        'relation': 'सम्बन्ध', 'friend': 'सम्बन्ध', 'family': 'सम्बन्ध', 'सम्बन्ध': 'सम्बन्ध'
    };

    const state = {
        activeCat: 'सबै',
        query: '',
        showFavOnly: false,
        favorites: new Set(JSON.parse(localStorage.getItem('favorites') || '[]'))
    };

    const grid = document.getElementById('grid');
    const categoriesEl = document.getElementById('categories');
    const emptyEl = document.getElementById('empty');
    const searchInput = document.getElementById('search');
    const searchIcon = document.getElementById('searchIcon');
    const toastEl = document.getElementById('toast');
    const favCountEl = document.getElementById('favCount');
    const favHubBtn = document.getElementById('favHubBtn');

    function updateFavBadge() {
        favCountEl.textContent = state.favorites.size;
    }

    function buildCategories() {
        const cats = new Set(QUOTES.map(q => q.cat));
        const arr = ['सबै', ...cats];
        categoriesEl.innerHTML = '';
        arr.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'chip' + (c === state.activeCat ? ' active' : '');
            btn.textContent = c;
            btn.onclick = () => {
                state.activeCat = c;
                state.showFavOnly = false;
                favHubBtn.classList.remove('active-mode');
                
                document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
                btn.classList.add('active');
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            categoriesEl.appendChild(btn);
        });
    }

    // Update Search Icon Class Based on English/Nepali Input Keywords
    function updateSearchIcon(query) {
        searchIcon.className = 'fa-solid'; // Reset classes
        
        const text = query.toLowerCase();
        if (!text) {
            searchIcon.classList.add('fa-magnifying-glass');
            return;
        }

        // Check language rules and match icons
        if (text.includes('love') || text.includes('maya') || text.includes('प्रेम') || text.includes('माया')) {
            searchIcon.classList.add('fa-heart', 'active-icon');
        } else if (text.includes('sad') || text.includes('दुख') || text.includes('pida') || text.includes('पीडा')) {
            searchIcon.classList.add('fa-face-sad-tear', 'sad-icon');
        } else if (text.includes('success') || text.includes('सफलता') || text.includes('win')) {
            searchIcon.classList.add('fa-trophy', 'success-icon');
        } else if (text.includes('life') || text.includes('जीवन') || text.includes('jiban')) {
            searchIcon.classList.add('fa-seedling', 'life-icon');
        } else if (text.includes('motivation') || text.includes('प्रेरणा') || text.includes('inspire')) {
            searchIcon.classList.add('fa-bolt', 'success-icon');
        } else if (text.includes('relation') || text.includes('सम्बन्ध') || text.includes('friend')) {
            searchIcon.classList.add('fa-user-group', 'life-icon');
        } else {
            searchIcon.classList.add('fa-magnifying-glass');
        }
    }

    function filterQuotes() {
        return QUOTES.filter(q => {
            const inCat = state.activeCat === 'सबै' || q.cat === state.activeCat;
            
            // Textual Matches
            const matchesText = q.text.toLowerCase().includes(state.query.toLowerCase());
            const matchesWriter = q.writer.toLowerCase().includes(state.query.toLowerCase());
            
            // Bilingual Keyword Mapping Check
            let matchesBilingual = false;
            const currentQuery = state.query.toLowerCase();
            for (const [key, categoryValue] of Object.entries(languageMap)) {
                if (currentQuery.includes(key) && q.cat === categoryValue) {
                    matchesBilingual = true;
                    break;
                }
            }

            const matchesFav = !state.showFavOnly || state.favorites.has(q.text);
            return inCat && (matchesText || matchesWriter || matchesBilingual) && matchesFav;
        });
    }

    function createCard(qObj, index) {
        const card = document.createElement('article');
        card.className = 'card';
        card.style.animationDelay = `${Math.min(index * 12, 250)}ms`;

        const quoteBody = document.createElement('div');
        quoteBody.className = 'quote-body';

        const quote = document.createElement('div');
        quote.className = 'quote';
        quote.textContent = qObj.text;
        quoteBody.appendChild(quote);

        const writer = document.createElement('div');
        writer.className = 'writer';
        writer.textContent = qObj.writer;
        quoteBody.appendChild(writer);

        card.appendChild(quoteBody);

        const meta = document.createElement('div');
        meta.className = 'meta';

        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.textContent = qObj.cat;
        meta.appendChild(tag);

        const actions = document.createElement('div');
        actions.className = 'actions';

        const favBtn = document.createElement('button');
        favBtn.className = 'icon-btn';
        const isFav = state.favorites.has(qObj.text);
        favBtn.innerHTML = isFav ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
        if (isFav) favBtn.classList.add('fav-on');
        
        favBtn.onclick = e => {
            e.stopPropagation();
            if (state.favorites.has(qObj.text)) {
                state.favorites.delete(qObj.text);
                favBtn.innerHTML = '<i class="fa-regular fa-heart"></i>';
                favBtn.classList.remove('fav-on');
                showToast('मनपर्ने सूचीबाट हटाइयो');
            } else {
                state.favorites.add(qObj.text);
                favBtn.innerHTML = '<i class="fa-solid fa-heart"></i>';
                favBtn.classList.add('fav-on');
                showToast('मनपर्ने सूचीमा थपियो');
            }
            localStorage.setItem('favorites', JSON.stringify([...state.favorites]));
            updateFavBadge();
            if (state.showFavOnly) render(); 
        };
        actions.appendChild(favBtn);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'icon-btn';
        copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>';
        copyBtn.onclick = () => {
            const copyContent = `"${qObj.text}" — ${qObj.writer}`;
            navigator.clipboard.writeText(copyContent).then(() => {
                showToast('क्लिपबोर्डमा कपि गरियो !');
                copyBtn.innerHTML = '<i class="fa-solid fa-check" style="color:#10b981"></i>';
                setTimeout(() => copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>', 1500);
            });
        };
        actions.appendChild(copyBtn);

        meta.appendChild(actions);
        card.appendChild(meta);
        return card;
    }

    function render() {
        const list = filterQuotes();
        grid.innerHTML = '';
        if (list.length === 0) {
            emptyEl.style.display = 'block';
            if(state.showFavOnly) {
                emptyEl.innerHTML = '<i class="fa-solid fa-heart-crack" style="font-size: 20px; margin-bottom: 8px; display: block; color:#ef4444;"></i>तपाईंको मनपर्ने सूची खाली छ।';
            } else {
                emptyEl.innerHTML = '<i class="fa-solid fa-magnifying-glass" style="font-size: 20px; margin-bottom: 8px; display: block;"></i>माफ गर्नुहोस्—कुनै पनि परिणाम फेला परेन।';
            }
        } else {
            emptyEl.style.display = 'none';
            const fragment = document.createDocumentFragment();
            list.forEach((q, i) => fragment.appendChild(createCard(q, i)));
            grid.appendChild(fragment);
        }
    }

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastEl._timer);
        toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    favHubBtn.addEventListener('click', () => {
        state.showFavOnly = !state.showFavOnly;
        if(state.showFavOnly) {
            favHubBtn.classList.add('active-mode');
            showToast('मनपर्ने Quotes मात्र देखाइँदैछ');
            document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
        } else {
            favHubBtn.classList.remove('active-mode');
            showToast('सबै Quotes हरू देखाइँदैछ');
            buildCategories();
        }
        render();
    });

    document.getElementById('logoHome').addEventListener('click', () => {
        state.activeCat = 'सबै';
        state.query = '';
        state.showFavOnly = false;
        searchInput.value = '';
        updateSearchIcon('');
        favHubBtn.classList.remove('active-mode');
        buildCategories();
        render();
    });

    searchInput.addEventListener('input', e => {
        state.query = e.target.value.trim();
        updateSearchIcon(state.query);
        render();
    });

    document.getElementById('randomBtn').addEventListener('click', () => {
        const idx = Math.floor(Math.random() * QUOTES.length);
        showToast(`"${QUOTES[idx].text}" — ${QUOTES[idx].writer}`);
    });

    document.getElementById('clearFav').addEventListener('click', () => {
        if (state.favorites.size === 0) {
            showToast('सूची पहिले नै खाली छ');
            return;
        }
        if (confirm('सबै मनपर्ने Quotes हरू हटाउन चाहनुहुन्छ?')) {
            state.favorites.clear();
            localStorage.setItem('favorites', '[]');
            state.showFavOnly = false;
            favHubBtn.classList.remove('active-mode');
            updateFavBadge();
            buildCategories();
            render();
            showToast('सूची खाली गरियो');
        }
    });

    document.getElementById('topBtn').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    buildCategories();
    updateFavBadge();
    render();
    </script>
</body>
</html>
